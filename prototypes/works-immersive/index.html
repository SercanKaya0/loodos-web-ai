<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Works — Loodos (immersive prototype)</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Eleven product stories from Loodos — scroll to fly through." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.1.13/+esm"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true">
    <span class="loader__brand">loodos</span>
    <span class="loader__pct" id="loaderPct">0</span>
    <span class="loader__bar"><i id="loaderBar"></i></span>
  </div>

  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="top__brand" href="https://loodos.com">loodos</a>
    <nav class="top__filters" id="filters" aria-label="Filter works"></nav>
    <a class="top__cta" href="https://loodos.com/contact">Contact</a>
  </header>

  <nav class="rail" id="rail" aria-label="Works index"></nav>
  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

  <div class="cursor" id="cursor" aria-hidden="true"><span>View</span></div>

  <main id="main">
    <section class="intro" id="intro">
      <div class="intro__inner">
        <p class="eyebrow">Selected work · 2016 — 2026</p>
        <h1 class="intro__title split">Works</h1>
        <p class="intro__lede">Eleven products, millions of daily users.<br />Scroll to fly through.</p>
        <div class="intro__hint" aria-hidden="true"><span></span>Scroll</div>
      </div>
    </section>

    <div id="works"></div>

    <section class="outro" id="outro">
      <div class="outro__inner">
        <p class="eyebrow">Next could be yours</p>
        <h2 class="outro__title split">Let's build<br />what's next.</h2>
        <a class="btn" href="https://loodos.com/contact">Book a call <span aria-hidden="true">→</span></a>
        <ol class="index" id="index"></ol>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
